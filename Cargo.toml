[package]
name = "kimun"
version = "0.40.0"
edition = "2024"
description = "Code metrics tool — health score, complexity, duplication, hotspots, ownership"
license = "MIT"
repository = "https://github.com/lnds/kimun"
homepage = "https://github.com/lnds/kimun"
keywords = ["code-metrics", "complexity", "loc", "halstead", "maintainability"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["assets/"]

[[bin]]
name = "km"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.57", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
git2 = "0.21"
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "rustls", "charset", "http2", "system-proxy"] }
tempfile = "3"
unicode-width = "0.2.2"
chrono = { version = "0.4.44", features = ["default"] }
clap_complete = "4.6.0"
terminal_size = "0.4"

